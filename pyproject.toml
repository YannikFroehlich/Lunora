[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501", # line length is handled by the formatter on a best-effort basis; long strings/URLs are fine
]

[tool.ruff.lint.isort]
known-first-party = ["app", "lunora"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
