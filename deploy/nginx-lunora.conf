map $http_x_forwarded_proto $lunora_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream lunora_gunicorn {
    server unix:/run/lunora/gunicorn.sock;
}

server {
    listen 127.0.0.1:8080;
    server_name lunora.yfserver.de;
    server_tokens off;
    client_max_body_size 25m;

    access_log /var/log/nginx/lunora-access.log;
    error_log /var/log/nginx/lunora-error.log warn;

    location /static/ {
        alias /srv/lunora/app/staticfiles/;
        access_log off;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /media/ {
        alias /srv/lunora/app/media/;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://lunora_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $lunora_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }
}
