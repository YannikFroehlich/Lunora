<div data-home-clock
     data-clock-timezone="{{ clock.timezone }}"
     data-clock-time-format="{{ clock.time_format }}"
     data-clock-date-format="{{ clock.date_format }}">
    {% include "app/partials/dashboard_widget_head.html" with icon="fa-regular fa-clock" title="Jetzt" meta=clock.timezone %}
    <div class="clock-face">
        <strong data-clock-time>{{ clock.time }}</strong>
        <span data-clock-weekday>{{ clock.weekday }}</span>
    </div>
    <div class="date-strip">
        <span class="date-number" data-clock-day>{{ clock.day }}</span>
        <div class="date-block">
            <strong data-clock-month>{{ clock.month }}</strong>
            <span data-clock-year>{{ clock.year }}</span>
        </div>
        <span class="date-moment"><i data-clock-moment-icon class="{{ dashboard_moment_icon }}" aria-hidden="true"></i> <span data-clock-moment-label>{{ dashboard_moment_label }}</span></span>
    </div>
    <span class="visually-hidden" data-clock-today>{{ today_label }}</span>
</div>
