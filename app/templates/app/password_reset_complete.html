{% extends 'app/base.html' %}
{% load static %}

{% block title %}Passwort aktualisiert | Lunora{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="glass-panel auth-panel">
        <div class="auth-brand">
            <img class="auth-brand-logo" src="{% static 'img/lunora_logo.svg' %}?v=brand-4" alt="" aria-hidden="true">
            <span>Lunora</span>
        </div>
        <h1>Passwort aktualisiert</h1>
        <p>Dein Passwort wurde erfolgreich geändert. Du kannst dich jetzt anmelden.</p>
        <p class="auth-switch"><a href="{% url 'login' %}">Zur Anmeldung</a></p>
    </div>
</section>
{% endblock %}
