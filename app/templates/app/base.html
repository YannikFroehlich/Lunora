{% load static %}

<!DOCTYPE html>
<html lang="de" data-theme="{{ appearance.theme }}" data-density="{{ appearance.density }}" data-authenticated="{{ request.user.is_authenticated|yesno:'true,false' }}" style="--color-accent: {{ appearance.accent_color }}; --color-accent-strong: {{ appearance.accent_strong }}; --background-overlay-alpha: {{ appearance.background_overlay_alpha }}; --background-highlight-alpha: {{ appearance.background_highlight_alpha }}; --glass-blur: {{ appearance.glass_blur }};">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Lunora{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    {% block page_css %}{% endblock %}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css">

    <script>
        // Apply the saved theme early to avoid a visible theme flash while loading.
        (function () {
            const storageKey = "lunora-theme";
            let savedTheme = null;

            try {
                savedTheme = localStorage.getItem(storageKey);
            } catch (error) {
                savedTheme = null;
            }

            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            const serverTheme = document.documentElement.dataset.theme;
            const isAuthenticated = document.documentElement.dataset.authenticated === "true";
            const theme = isAuthenticated && ["light", "dark"].includes(serverTheme)
                ? serverTheme
                : ["light", "dark"].includes(savedTheme)
                ? savedTheme
                : (prefersDark ? "dark" : "light");

            document.documentElement.dataset.theme = theme;
            document.documentElement.style.colorScheme = theme;
        })();
    </script>
</head>
<body>
{% if request.user.is_authenticated %}
<nav class="floating-nav" aria-label="Hauptnavigation">
    <a class="nav-orb {% if active_page == 'home' %}is-active{% endif %}" href="{% url 'home' %}" aria-label="Dashboard">
        <i class="fa-solid fa-house" aria-hidden="true"></i>
    </a>
    {% url 'settings' as settings_url %}
    <a class="nav-orb {% if active_page == 'settings' %}is-active{% endif %}" href="{% if active_page == 'settings' %}{{ settings_url }}{% else %}{{ settings_url }}?next={{ request.get_full_path|urlencode }}{% endif %}" aria-label="Einstellungen">
        <i class="fa-solid fa-gear" aria-hidden="true"></i>
    </a>
    <form class="nav-form" method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button class="nav-orb" type="submit" aria-label="Abmelden">
            <i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>
        </button>
    </form>
</nav>
{% endif %}

<main class="site-main">
    {% block content %}{% endblock %}
</main>

<script src="{% static 'js/base.js' %}"></script>
{% block page_js %}{% endblock %}
</body>
</html>
