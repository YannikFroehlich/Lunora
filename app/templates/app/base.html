{% load static %}

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Lunora{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/base.css' %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css">

    <script>
        // Apply the saved theme early to avoid a visible theme flash while loading.
        (function () {
            const savedTheme = localStorage.getItem("lunora-theme");
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            const theme = savedTheme || (prefersDark ? "dark" : "light");

            document.documentElement.dataset.theme = theme;
        })();
    </script>

</head>
<body>

<header class="site-header">
    <nav class="navbar">
        <a href="#" class="logo">Lunora</a>

        <div class="nav-links">
            <a href="#">
                <i class="fa-solid fa-house"></i>
            </a>
            <a href="#">
                <i class="fa-solid fa-gear"></i>
            </a>
            <a class="theme-toggle" type="button" aria-label="Switch to dark mode">
                <i class="fa-solid fa-moon" aria-hidden="true"></i>
            </a>
        </div>
    </nav>
</header>

<main class="site-main">
    {% block content %}
    {% endblock %}
</main>

<footer class="site-footer">
</footer>

<script src="{% static 'js/base.js' %}"></script>
</body>
</html>
