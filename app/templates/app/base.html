{% load static %}

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Lunora{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    {% block page_css %}{% endblock %}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css">

    <script>
        // Apply the saved theme early to avoid a visible theme flash while loading.
        (function () {
            const savedTheme = localStorage.getItem("lunora-theme");
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            const theme = savedTheme || (prefersDark ? "dark" : "light");

            document.documentElement.dataset.theme = theme;
        })();
    </script>
</head>
<body>
<nav class="floating-nav" aria-label="Hauptnavigation">
    <a class="nav-orb {% if active_page == 'home' %}is-active{% endif %}" href="{% url 'home' %}" aria-label="Dashboard">
        <i class="fa-solid fa-house" aria-hidden="true"></i>
    </a>
    <a class="nav-orb {% if active_page == 'settings' %}is-active{% endif %}" href="{% url 'settings' %}" aria-label="Einstellungen">
        <i class="fa-solid fa-gear" aria-hidden="true"></i>
    </a>
</nav>

<main class="site-main">
    {% block content %}{% endblock %}
</main>

<script src="{% static 'js/base.js' %}"></script>
{% block page_js %}{% endblock %}
</body>
</html>
