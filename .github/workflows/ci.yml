name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: django-insecure-ci-only-key
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Django checks and tests
        run: |
          python manage.py check
          python manage.py test

      - name: Run frontend tests
        run: npm test

      - name: Verify committed frontend bundle
        run: |
          npm run build
          git diff --exit-code -- app/static/js/bundles/notes.js
